name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: vps
        type: choice
        options:
          - vps
          - dokku
  push:
    branches:
      - main
      - master

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache TypeScript
        uses: actions/cache@v6
        with:
          path: .tsbuildinfo
          key: tsbuildinfo-${{ github.sha }}
          restore-keys: tsbuildinfo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome
        run: bunx @biomejs/biome check .

      - name: Run typecheck
        run: bun run typecheck

      - name: Run tests
        env:
          VITEST_MAX_WORKERS: 4
        run: bun run test

      - name: Run production build
        run: bun run build

  build-image:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'vps') || (github.event_name == 'push' && vars.DEPLOY_TARGET == 'vps') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'vps') || (github.event_name == 'push' && vars.DEPLOY_TARGET == 'vps') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-image
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          : "${VPS_HOST:?VPS_HOST secret is required}"
          : "${VPS_SSH_PRIVATE_KEY:?VPS_SSH_PRIVATE_KEY secret is required}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to VPS with Docker Compose
        env:
          APP_PORT: ${{ vars.APP_PORT }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          DB_POOL_MAX: ${{ vars.DB_POOL_MAX }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          TRUSTED_PROXY_COUNT: ${{ vars.TRUSTED_PROXY_COUNT }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          : "${VPS_HOST:?VPS_HOST secret is required}"
          : "${VPS_USER:?VPS_USER secret is required}"
          : "${GHCR_USERNAME:?GHCR_USERNAME secret is required}"
          : "${GHCR_TOKEN:?GHCR_TOKEN secret is required}"
          : "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD secret is required}"
          : "${ENCRYPTION_KEY:?ENCRYPTION_KEY secret is required}"
          : "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET secret is required}"
          : "${BETTER_AUTH_URL:?BETTER_AUTH_URL secret is required}"

          DEPLOY_PATH="${VPS_DEPLOY_PATH:-/opt/hermes-hub}"
          SSH_PORT="${VPS_PORT:-22}"
          APP_PORT="${APP_PORT:-3000}"
          POSTGRES_DB="${POSTGRES_DB:-hermes_hub}"
          POSTGRES_USER="${POSTGRES_USER:-hermes}"
          TRUSTED_PROXY_COUNT="${TRUSTED_PROXY_COUNT:-1}"
          DB_POOL_MAX="${DB_POOL_MAX:-5}"

          cat > .deploy.env <<EOF_ENV
          APP_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          APP_PORT=$APP_PORT
          POSTGRES_DB=$POSTGRES_DB
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          ENCRYPTION_KEY=$ENCRYPTION_KEY
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET
          BETTER_AUTH_URL=$BETTER_AUTH_URL
          RESEND_API_KEY=${RESEND_API_KEY:-}
          RESEND_FROM=${RESEND_FROM:-}
          TRUSTED_PROXY_COUNT=$TRUSTED_PROXY_COUNT
          DB_POOL_MAX=$DB_POOL_MAX
          EOF_ENV

          ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -P "$SSH_PORT" ./compose.yaml "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/compose.yaml"
          scp -P "$SSH_PORT" ./.deploy.env "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/.env"
          rm -f .deploy.env

          printf '%s' "$GHCR_TOKEN" | ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "docker login ${{ env.REGISTRY }} -u '$GHCR_USERNAME' --password-stdin"
          ssh -p "$SSH_PORT" "$VPS_USER@$VPS_HOST" "cd '$DEPLOY_PATH' && docker compose pull app && docker compose up -d postgres && until [ \"\$(docker inspect -f '{{.State.Health.Status}}' \$(docker compose ps -q postgres))\" = healthy ]; do sleep 2; done && docker compose run --rm app ./node_modules/.bin/drizzle-kit migrate && docker compose up -d app && docker compose ps"

  deploy-dokku:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'dokku') || (github.event_name == 'push' && vars.DEPLOY_TARGET != 'vps') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: validate
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
          DOKKU_SSH_PORT: ${{ secrets.DOKKU_SSH_PORT }}
          DOKKU_SSH_PRIVATE_KEY: ${{ secrets.DOKKU_SSH_PRIVATE_KEY }}
        run: |
          : "${DOKKU_HOST:?DOKKU_HOST secret is required}"
          : "${DOKKU_SSH_PRIVATE_KEY:?DOKKU_SSH_PRIVATE_KEY secret is required}"
          DOKKU_PORT="${DOKKU_SSH_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DOKKU_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DOKKU_PORT" "$DOKKU_HOST" >> ~/.ssh/known_hosts

      - name: Sync Dokku config
        id: sync-config
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_POOL_MAX: ${{ vars.DB_POOL_MAX }}
          DOKKU_APP: ${{ secrets.DOKKU_APP }}
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
          DOKKU_SSH_PORT: ${{ secrets.DOKKU_SSH_PORT }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          TRUSTED_PROXY_COUNT: ${{ vars.TRUSTED_PROXY_COUNT }}
        run: |
          : "${DOKKU_HOST:?DOKKU_HOST secret is required}"
          : "${DOKKU_APP:?DOKKU_APP secret is required}"
          : "${DATABASE_URL:?DATABASE_URL secret is required for Dokku deploys}"
          : "${ENCRYPTION_KEY:?ENCRYPTION_KEY secret is required}"
          : "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET secret is required}"
          : "${BETTER_AUTH_URL:?BETTER_AUTH_URL secret is required}"

          DOKKU_PORT="${DOKKU_SSH_PORT:-22}"
          TRUSTED_PROXY_COUNT="${TRUSTED_PROXY_COUNT:-1}"
          DB_POOL_MAX="${DB_POOL_MAX:-5}"

          if ssh -p "$DOKKU_PORT" "dokku@$DOKKU_HOST" apps:exists "$DOKKU_APP" 2>/dev/null; then
            echo "app_created=false" >> "$GITHUB_OUTPUT"
          else
            ssh -p "$DOKKU_PORT" "dokku@$DOKKU_HOST" apps:create "$DOKKU_APP"
            echo "app_created=true" >> "$GITHUB_OUTPUT"
          fi

          args=(
            "NODE_ENV=production"
            "DATABASE_URL=$DATABASE_URL"
            "ENCRYPTION_KEY=$ENCRYPTION_KEY"
            "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET"
            "BETTER_AUTH_URL=$BETTER_AUTH_URL"
            "TRUSTED_PROXY_COUNT=$TRUSTED_PROXY_COUNT"
            "DB_POOL_MAX=$DB_POOL_MAX"
          )

          if [ -n "${RESEND_API_KEY:-}" ]; then
            args+=("RESEND_API_KEY=$RESEND_API_KEY")
          fi

          if [ -n "${RESEND_FROM:-}" ]; then
            args+=("RESEND_FROM=$RESEND_FROM")
          fi

          ssh -p "$DOKKU_PORT" "dokku@$DOKKU_HOST" config:set --no-restart "$DOKKU_APP" "${args[@]}"

      - name: Verify TLS certificate on the Dokku app
        env:
          DOKKU_APP: ${{ secrets.DOKKU_APP }}
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
          DOKKU_SSH_PORT: ${{ secrets.DOKKU_SSH_PORT }}
        run: |
          : "${DOKKU_APP:?DOKKU_APP secret is required}"
          : "${DOKKU_HOST:?DOKKU_HOST secret is required}"
          DOKKU_PORT="${DOKKU_SSH_PORT:-22}"

          # The first deploy of a brand-new app cannot have a certificate yet, and
          # letsencrypt's HTTP-01 challenge requires a live app reachable on :80.
          # Defer the TLS requirement to the next deploy so a fresh Dokku target
          # is not deadlocked.
          if [ "${{ steps.sync-config.outputs.app_created }}" = "true" ]; then
            echo "App '$DOKKU_APP' was just created - skipping TLS check for this bootstrap deploy."
            exit 0
          fi

          # Primary: certificate issued by the dokku-letsencrypt plugin.
          if [ "$(ssh -p "$DOKKU_PORT" "dokku@$DOKKU_HOST" letsencrypt:active "$DOKKU_APP" 2>/dev/null || true)" = "true" ]; then
            echo "TLS certificate found on '$DOKKU_APP' (letsencrypt)."
            exit 0
          fi

          # Fallback: manually installed certificate (dokku certs:add).
          CERT_EXISTS="$(ssh -p "$DOKKU_PORT" "dokku@$DOKKU_HOST" certs:report "$DOKKU_APP" --certs-certificate-exists 2>/dev/null || true)"
          if [ "$CERT_EXISTS" != "true" ]; then
            CERT_REPORT="$(ssh -p "$DOKKU_PORT" "dokku@$DOKKU_HOST" certs:report "$DOKKU_APP" 2>/dev/null || true)"
            if printf '%s' "$CERT_REPORT" | grep -qi "certificate exists: true"; then
              CERT_EXISTS="true"
            fi
          fi
          if [ "$CERT_EXISTS" = "true" ]; then
            echo "TLS certificate found on '$DOKKU_APP' (custom cert)."
            exit 0
          fi

          echo "::error::No TLS certificate is installed on Dokku app '$DOKKU_APP'. It runs with NODE_ENV=production and the HTTPS guard (httpsMiddleware) rejects plain HTTP with 426, so credential-bearing routes (install progress, provider save/deploy, Telegram, web UI proxy) would be broken."
          echo "::error::Enable TLS on the host, then retry:"
          echo "::error::  - dokku letsencrypt:enable $DOKKU_APP (install the dokku-letsencrypt plugin and set an ACME email first)"
          echo "::error::  - or install a custom certificate: dokku certs:add $DOKKU_APP < server.crt > server.key"
          exit 1

      - name: Deploy to Dokku
        env:
          DOKKU_APP: ${{ secrets.DOKKU_APP }}
          DOKKU_HOST: ${{ secrets.DOKKU_HOST }}
          DOKKU_SSH_PORT: ${{ secrets.DOKKU_SSH_PORT }}
        run: |
          DOKKU_PORT="${DOKKU_SSH_PORT:-22}"
          # Git's SSH backend needs the port in the remote URL or an SSH config entry.
          # An SSH config entry is cleaner and also covers the keyscan host key.
          {
            echo "Host $DOKKU_HOST"
            echo "  Port $DOKKU_PORT"
            echo "  IdentityFile ~/.ssh/id_ed25519"
            echo "  StrictHostKeyChecking accept-new"
          } >> ~/.ssh/config

          git remote add dokku "dokku@$DOKKU_HOST:$DOKKU_APP" 2>/dev/null || git remote set-url dokku "dokku@$DOKKU_HOST:$DOKKU_APP"
          git push dokku HEAD:master
