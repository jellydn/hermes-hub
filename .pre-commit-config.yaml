repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-json

  - repo: https://github.com/biomejs/pre-commit
    rev: v0.6.1
    hooks:
      - id: biome-check
        additional_dependencies:
          - "@biomejs/biome"

  - repo: local
    hooks:
      - id: typecheck
        name: TypeScript typecheck
        entry: bun run typecheck
        language: system
        pass_filenames: false
        files: \.(ts|tsx)$
        stages: [push]
  - repo: local
    hooks:
      - id: react-doctor
        name: react-doctor
        entry: sh -c 'react_doctor_output=$(mktemp "${TMPDIR:-/tmp}/react-doctor-hook.XXXXXX"); if bunx react-doctor --staged --blocking warning > "$react_doctor_output" 2>&1; then rm -f "$react_doctor_output"; else rm -f "$react_doctor_output"; printf "%s\n" "React Doctor found staged regressions." "Run react-doctor --staged --blocking warning to inspect." "Want them fixed? Ask your agent to run that command and resolve the findings." >&2; exit 1; fi'
        language: system
        pass_filenames: false
